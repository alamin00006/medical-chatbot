name: CI/CD

# Flow: checks → build & push images to Docker Hub → self-hosted server pulls & runs them.
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "backend/research/**"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BACKEND_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/medical-chatbot-backend
  FRONTEND_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/medical-chatbot-frontend

jobs:
  checks:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q backend/app.py backend/src

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

  build-and-push:
    name: Build & push (${{ matrix.service }})
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: backend
            context: ./backend
            image_var: BACKEND_IMAGE
          - service: frontend
            context: ./frontend
            image_var: FRONTEND_IMAGE
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env[matrix.image_var] }}:${{ github.sha }}
            ${{ env[matrix.image_var] }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Pull & run on server
    needs: build-and-push
    runs-on: self-hosted
    environment: production
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      IMAGE_TAG: ${{ github.sha }}
      APP_PORT: ${{ vars.APP_PORT || '80' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker-compose.yml
            backend/Dockerfile
          sparse-checkout-cone-mode: false

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Write backend .env
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PINECONE_INDEX_NAME: ${{ vars.PINECONE_INDEX_NAME || 'medical-chatbot' }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'qwen/qwen3.8-27b' }}
        run: |
          umask 077
          {
            echo "PINECONE_API_KEY=${PINECONE_API_KEY}"
            echo "GROQ_API_KEY=${GROQ_API_KEY}"
            echo "PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME}"
            echo "GROQ_MODEL=${GROQ_MODEL}"
          } > backend/.env

      - name: Pull images
        run: docker compose pull

      - name: Start containers
        run: docker compose up -d --remove-orphans --wait --wait-timeout 300

      - name: Show status
        if: always()
        run: docker compose ps

      - name: Remove old images
        if: success()
        run: docker image prune -f

      - name: Clean up credentials
        if: always()
        run: |
          rm -f backend/.env
          docker logout || true
